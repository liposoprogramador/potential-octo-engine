<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/html-css/ex004/favicon-32x32.png" type="image/png">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/vitoria-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/vitoria-m.png" type="image/png">
        <img src="imagens/vitoria-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" none controls loop>
        <source src="midia/Hino-do-Esporte-Clube-Vitória.mp3" type="audio/mpeg">
        <source src="midia/Hino-do-Esporte-Clube-Vitória.ogg" type="audio/ogg">
        <source src="midia/Hino-do-Esporte-Clube-Vitória.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/Hino-do-Esporte-Clube-Vitória.mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>
</body>
</html>
